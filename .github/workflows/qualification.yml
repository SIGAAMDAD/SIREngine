name: SIREngine qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character source commit SHA'
        required: true
        type: string
      system:
        description: 'Compiled production scope'
        required: true
        type: choice
        options: [all, Core, Resources, Renderer, Terrain, Editor, Scripting, Audio, GraphicsABI]
      issue:
        description: 'Authoritative GitHub issue number'
        required: true
        type: string
permissions:
  contents: read
jobs:
  coverage:
    name: LLVM 23 full source coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate exact requested checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ./.github/actions/setup-build-tools
      - run: git submodule update --init ThirdParty/GoogleTest
      - name: Install authenticated LLVM 23 toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          fingerprint="$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm-key.asc" | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor < "$RUNNER_TEMP/llvm-key.asc" > "$RUNNER_TEMP/llvm-key.gpg"
          sudo install -D -m 0644 "$RUNNER_TEMP/llvm-key.gpg" /etc/apt/keyrings/sir-llvm-23.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/sir-llvm-23.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/sir-llvm-23.list
          sudo apt-get update
          sudo apt-get install -y clang-23 llvm-23 libclang-rt-23-dev ninja-build
          clang++-23 --version | grep -F 23.1.5
          llvm-cov-23 --version | grep -F 23.1.5
      - name: Verify GRDG collector negative-path tests
        run: python3 Tests/Profiling/TestSIRGRDGCoverageCollector.py
      - name: Test LLVM 23 qualification negative paths
        run: python3 Tests/Profiling/TestRunLLVM23Qualification.py
      - name: Qualify all compiled production code
        env:
          SIR_QUALIFICATION_SCOPE: ${{ inputs.system }}
        run: bash Build/Scripts/RunLLVM23Qualification.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm23-source-coverage
          path: out/Verification/LLVM23/
          if-no-files-found: warn
          retention-days: 30
  native:
    name: Native functional acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate exact requested checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ./.github/actions/setup-build-tools
      - run: git submodule update --init ThirdParty/GoogleTest
      - run: |
          cmake --preset dev -DSIR_WITH_GOOGLETEST=ON
          cmake --build --preset dev
          ctest --preset dev --output-on-failure --no-tests=error
  sanitizer:
    name: ASan and UBSan native acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate exact requested checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ./.github/actions/setup-build-tools
      - run: git submodule update --init ThirdParty/GoogleTest
      - name: Run full sanitized native suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --preset asan -DSIR_WITH_GOOGLETEST=ON -DSIR_ENABLE_UBSAN=ON
          cmake --build --preset asan
          ctest --preset asan --output-on-failure --no-tests=error
  acceptance:
    name: Qualification acceptance
    if: always()
    runs-on: ubuntu-24.04
    needs: [coverage, native, sanitizer]
    steps:
      - name: Refuse incomplete gates
        env:
          COVERAGE: ${{ needs.coverage.result }}
          NATIVE: ${{ needs.native.result }}
          SANITIZER: ${{ needs.sanitizer.result }}
        run: test "$COVERAGE" = success && test "$NATIVE" = success && test "$SANITIZER" = success
