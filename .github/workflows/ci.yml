name: SIREngine CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sir-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source hygiene and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate tracked paths and pins
        run: cmake -P Build/CMake/CIHygiene.cmake
      - name: Enforce owned C++ declarations and headers
        run: cmake -P Build/CMake/CIStyle.cmake
      - name: Install native clang-format 18.1.8
        shell: bash
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/clang-format.json"
          archive="${RUNNER_TEMP}/clang-format.zip"
          bindir="${RUNNER_TEMP}/native-tools"
          mkdir -p "${bindir}"
          curl -fsSL --retry 3 https://pypi.org/pypi/clang-format/18.1.8/json -o "${metadata}"
          filter='.urls[] | select(.filename | contains("manylinux_2_17_x86_64"))'
          url="$(jq -er "${filter} | .url" "${metadata}")"
          digest="$(jq -er "${filter} | .digests.sha256" "${metadata}")"
          test "${digest}" = "2de122b8aa78ba49e326f974131caab2c79f4ae877c227cd4e3e5d82a98d21e5"
          curl -fsSL --retry 3 "${url}" -o "${archive}"
          printf '%s  %s\n' "${digest}" "${archive}" | sha256sum -c -
          binary="$(unzip -Z1 "${archive}" | grep -E '/bin/clang-format$' | head -n 1)"
          test -n "${binary}"
          unzip -p "${archive}" "${binary}" > "${bindir}/clang-format"
          chmod +x "${bindir}/clang-format"
          "${bindir}/clang-format" --version
          echo "${bindir}" >> "${GITHUB_PATH}"
      - name: Check C++ formatting
        run: cmake "-DSIR_CLANG_FORMAT=${RUNNER_TEMP}/native-tools/clang-format" -P Build/CMake/CIFormat.cmake

  native:
    name: Native C++17 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: dev
          - os: windows-2022
            preset: dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned GoogleTest for native C++17 tests
        run: git submodule update --init ThirdParty/GoogleTest
      - name: Set up MSVC compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: ./.github/actions/setup-build-tools
      - uses: actions/cache@v4
        with:
          path: .cache/fastbuild
          key: sir-fbuild-v1.20-${{ runner.os }}-dev-${{ github.sha }}
          restore-keys: |
            sir-fbuild-v1.20-${{ runner.os }}-dev-
      - name: Fetch pinned GameInput v1 native SDK header
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $includeDir = Join-Path $env:RUNNER_TEMP 'sir-gameinput-v1'
          New-Item -ItemType Directory -Path $includeDir -Force | Out-Null
          $header = Join-Path $includeDir 'GameInput.h'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/microsoftconnect/GameInput/dce6dabd75b53fcb29db86afe4de5c917921af18/include/v1/GameInput.h' -OutFile $header
          $blob = (git hash-object -- $header).Trim()
          if ($blob -notin @('ebd3875a7a7e7892d1723f1a8467fe6ca8325620', '9c83ed575a92be52cdfac22baa98ee2136d7607e')) { throw "GameInput v1 header source mismatch: $blob" }
          Add-Content -Path $env:GITHUB_ENV -Value "SIR_GAMEINPUT_SDK_INCLUDE=$includeDir"
      - name: Configure native engine
        run: cmake --preset "${{ matrix.preset }}" -DSIR_WITH_GOOGLETEST=ON -DSIR_REQUIRE_GAMEINPUT_SDK=${{ runner.os == 'Windows' && 'ON' || 'OFF' }}
      - name: Compile engine and tests
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: Run allocator unit tests (GoogleTest)
        run: >
          ctest --preset "${{ matrix.preset }}"
          --output-on-failure
          --no-tests=error
          -R '^core[.]memory[.]allocators[.]'
          --output-junit "${{ github.workspace }}/allocator-tests-${{ matrix.os }}.xml"
      - name: Upload allocator unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allocator-unit-tests-${{ matrix.os }}
          path: allocator-tests-${{ matrix.os }}.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Run remaining native tests
        run: >
          ctest --preset "${{ matrix.preset }}"
          --output-on-failure
          --no-tests=error
          -E '^core[.]memory[.]allocators[.]'
      - name: Repeat native input stress regressions
        run: >
          ctest --preset "${{ matrix.preset }}"
          --output-on-failure
          --repeat until-fail:5
          -R '^core[.]platform[.]input([.]stress)?$'
      - name: Verify no-op incremental rebuild
        run: cmake --build --preset dev

  profiling-smoke:
    name: Google Benchmark compile and execution / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned Google testing sources
        run: git submodule update --init ThirdParty/GoogleTest ThirdParty/GoogleBenchmark
      - uses: ./.github/actions/setup-build-tools
      - uses: actions/cache@v4
        with:
          path: .cache/fastbuild
          key: sir-fbuild-v1.20-google-profile-linux-${{ github.sha }}
          restore-keys: |
            sir-fbuild-v1.20-google-profile-linux-
      - name: Configure optimized C++17 Google profiling
        run: >
          cmake --preset profile
          -DSIR_WITH_GOOGLETEST=ON
          -DSIR_WITH_GOOGLE_BENCHMARK=ON
          -DSIR_BUILD_BENCHMARKS=ON
      - name: Compile profiling executables
        run: cmake --build --preset profile
      - name: Run GoogleTest and lifecycle CTest suite
        run: ctest --preset profile --output-on-failure
      - name: Run CPU benchmark smoke and write JSON
        shell: bash
        run: bash Build/Scripts/RunGoogleBenchmarks.sh ubuntu-24.04-pr
      - name: Preserve CPU benchmark evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sir-google-benchmark-ci
          path: out/Nightly/Benchmarks/
          if-no-files-found: error
          retention-days: 14
