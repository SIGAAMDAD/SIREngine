name: SIREngine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the frozen integration candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sir-ci-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source hygiene and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen integration candidate source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate tracked paths and pins
        run: cmake -P Build/CMake/CIHygiene.cmake
      - name: Enforce owned C++ declarations and headers
        run: cmake -P Build/CMake/CIStyle.cmake
      - name: Install native clang-format 23.1.5
        shell: bash
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/clang-format.json"
          archive="${RUNNER_TEMP}/clang-format.zip"
          bindir="${RUNNER_TEMP}/native-tools"
          mkdir -p "${bindir}"
          curl -fsSL --retry 3 https://pypi.org/pypi/clang-format/23.1.5/json -o "${metadata}"
          filter='.urls[] | select(.filename | contains("manylinux_2_27_x86_64"))'
          url="$(jq -er "${filter} | .url" "${metadata}")"
          digest="$(jq -er "${filter} | .digests.sha256" "${metadata}")"
          curl -fsSL --retry 3 "${url}" -o "${archive}"
          printf '%s  %s\n' "${digest}" "${archive}" | sha256sum -c -
          binary="$(unzip -Z1 "${archive}" | grep -E '/bin/clang-format$' | head -n 1)"
          test -n "${binary}"
          unzip -p "${archive}" "${binary}" > "${bindir}/clang-format"
          chmod +x "${bindir}/clang-format"
          "${bindir}/clang-format" --version
          echo "${bindir}" >> "${GITHUB_PATH}"
      - name: Check changed-file formatting
        env:
          SIR_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.event.merge_group.base_sha || '' }}
        shell: bash
        run: |
          if [[ -n "$SIR_BASE" ]]; then
            cmake -DSIR_FORMAT_BASE="$SIR_BASE" -P Build/CMake/CIFormat.cmake
          else
            cmake -P Build/CMake/CIFormat.cmake
          fi
      - name: Lint every workflow with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint-1.7.12.tar.gz"
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -ignore 'unexpected key "queue"' .github/workflows/*.yml
      - name: Verify CI and LLVM gate negative cases
        run: |
          python3 -m unittest discover -s Tests/CI -p 'Test*.py'
          python3 Tests/Profiling/TestRunLLVM23Qualification.py
          bash -n Build/CI/InstallLLVM23.sh

  native:
    name: sir/native / ${{ matrix.os }} / ${{ matrix.compiler }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: dev
            compiler: gcc
          - os: ubuntu-24.04
            preset: dev
            compiler: clang
          - os: windows-2022
            preset: dev
            compiler: msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - name: Verify frozen integration candidate source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Fetch pinned GoogleTest for native C++17 tests
        run: git submodule update --init ThirdParty/GoogleTest
      - name: Set up MSVC compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: ./.github/actions/setup-build-tools
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/fastbuild
          key: sir-fbuild-v1.20-${{ runner.os }}-${{ matrix.compiler }}-dev-${{ inputs.candidate_sha || github.sha }}
          restore-keys: |
            sir-fbuild-v1.20-${{ runner.os }}-${{ matrix.compiler }}-dev-
      - name: Install LLVM 23 compiler for PR checks
        if: matrix.compiler == 'clang'
        env:
          SIR_LLVM_MODE: pr
        run: bash Build/CI/InstallLLVM23.sh
      - name: Record compiler identity
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            cl.exe /? > /dev/null
            echo "MSVC toolset: ${VCToolsVersion:-unknown}"
            echo "Windows SDK: ${WindowsSDKVersion:-unknown}"
          elif [[ "${{ matrix.compiler }}" == clang ]]; then
            clang++-23 --version
          else
            g++ --version
          fi
      - name: Configure native engine
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.compiler }}" == clang ]]; then export CC=clang-23 CXX=clang++-23; fi
          cmake --preset "${{ matrix.preset }}" -DSIR_WITH_GOOGLETEST=ON
      - name: Compile engine and tests
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: Run and account for every selected native test
        shell: bash
        run: |
          set -euo pipefail
          label='^gate:pr$'
          if [[ "${{ github.event_name }}" != pull_request ]]; then label='^gate:main$'; fi
          python_cmd=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_cmd=python; fi
          "$python_cmd" Build/CI/RunCTestGate.py --preset "${{ matrix.preset }}" --label "$label" --report "out/Verification/CI/${{ matrix.compiler }}-ctest.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sir-native-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.run_id }}
          path: out/Verification/CI/
          if-no-files-found: warn
          retention-days: 21

  required:
    name: sir/required
    runs-on: ubuntu-24.04
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [source, native]
    steps:
      - name: Reject missing or skipped mandatory jobs
        env:
          SOURCE: ${{ needs.source.result }}
          NATIVE: ${{ needs.native.result }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          test "$SOURCE" = success
          test "$DRAFT" != true
          test "$NATIVE" = success
          echo "CI checkout SHA: ${{ inputs.candidate_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  integration-candidate:
    name: sir/integration-candidate
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: [source, native]
    steps:
      - name: Verify exact-source candidate accepted
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_RESULT" = success
          test "$NATIVE_RESULT" = success
          printf 'Qualified integration candidate: %s\n' "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
