name: SIREngine CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: sir-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  source:
    name: Source format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed C++ formatting
        run: |
          python3 -m pip install --disable-pip-version-check clang-format==23.1.5
          bash Build/Scripts/FormatAll.sh --ci
  native:
    name: sir/native / ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, compiler: gcc}
          - {os: ubuntu-24.04, compiler: clang}
          - {os: windows-2022, compiler: msvc}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - uses: ./.github/actions/setup-build-tools
      - run: git submodule update --init ThirdParty/GoogleTest
      - name: Install LLVM 23 for Clang checks
        if: matrix.compiler == 'clang'
        env:
          SIR_LLVM_MODE: pr
        run: bash Build/CI/InstallLLVM23.sh
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.compiler }}" == clang ]]; then export CC=clang-23 CXX=clang++-23; fi
          cmake --preset dev -DSIR_WITH_GOOGLETEST=ON
          cmake --build --preset dev
          ctest --preset pr-smoke --no-tests=error --output-on-failure
  codeql:
    name: sir/codeql / ${{ matrix.language }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {language: c-cpp, build_mode: manual}
          - {language: actions, build_mode: none}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
        if: matrix.language == 'c-cpp'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - name: Build C++ for CodeQL extraction
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cmake --preset tooling -DSIR_BUILD_TESTS=OFF -DSIR_BUILD_BENCHMARKS=OFF -DSIR_ENABLE_UNITY=OFF -DSIR_ENABLE_PCH=OFF
          cmake --build --preset tooling --parallel 2
      - name: Analyze CodeQL and retain local results
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
          output: ${{ github.workspace }}/out/Verification/CodeQL
      - name: Retain CodeQL SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ matrix.language }}
          path: out/Verification/CodeQL/*.sarif
          if-no-files-found: error
          retention-days: 30
  required:
    name: sir/required
    if: always()
    needs: [source, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and native checks
        env:
          SOURCE: ${{ needs.source.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$SOURCE" = success && test "$NATIVE" = success
