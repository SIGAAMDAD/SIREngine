name: SIREngine CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: sir-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  source:
    name: Source format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed C++ formatting
        env:
          SIR_FORMAT_BASE: ${{ github.event.before }}
        run: |
          python3 -m pip install --disable-pip-version-check clang-format==23.1.5
          bash Build/Scripts/FormatAll.sh --ci
  native:
    name: sir/native / ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, compiler: gcc}
          - {os: ubuntu-24.04, compiler: clang}
          - {os: windows-2022, compiler: msvc}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - uses: ./.github/actions/setup-build-tools
      - run: git submodule update --init ThirdParty/GoogleTest
      - name: Install LLVM 23 for Clang checks
        if: matrix.compiler == 'clang'
        env:
          SIR_LLVM_MODE: pr
        run: bash Build/CI/InstallLLVM23.sh
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.compiler }}" == clang ]]; then export CC=clang-23 CXX=clang++-23; fi
          cmake --preset dev -DSIR_WITH_GOOGLETEST=ON
          cmake --build --preset dev
          ctest --preset pr-smoke --no-tests=error --output-on-failure
  required:
    name: sir/required
    if: always()
    needs: [source, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and native checks
        env:
          SOURCE: ${{ needs.source.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$SOURCE" = success && test "$NATIVE" = success
