name: SIREngine CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sir-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source hygiene and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate tracked paths and pins
        run: cmake -P Build/CMake/CIHygiene.cmake
      - name: Obtain pinned clang-format
        run: python3 -m pip install --disable-pip-version-check --no-deps clang-format==22.1.5
      - name: Check C++ formatting
        run: cmake -P Build/CMake/CIFormat.cmake

  native:
    name: Native C++17 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-ci
          - os: windows-2022
            preset: windows-ci
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: sir-native-v1-${{ matrix.os }}-debug
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up MSVC compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '4.4.5'
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Configure native engine
        run: cmake --preset "${{ matrix.preset }}" -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Compile engine and tests
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2
      - name: Run native tests
        run: ctest --preset "${{ matrix.preset }}"
      - name: Compiler-cache statistics
        if: always()
        run: sccache --show-stats
