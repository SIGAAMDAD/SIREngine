name: SIREngine CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sir-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source hygiene and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tracked paths and pins
        run: cmake -P Build/CMake/CIHygiene.cmake
      - name: Enforce owned C++ declarations and headers
        run: cmake -P Build/CMake/CIStyle.cmake
      - name: Install native clang-format 23.1.5
        shell: bash
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/clang-format.json"
          archive="${RUNNER_TEMP}/clang-format.zip"
          bindir="${RUNNER_TEMP}/native-tools"
          mkdir -p "${bindir}"
          curl -fsSL --retry 3 https://pypi.org/pypi/clang-format/23.1.5/json -o "${metadata}"
          filter='.urls[] | select(.filename | contains("manylinux_2_27_x86_64"))'
          url="$(jq -er "${filter} | .url" "${metadata}")"
          digest="$(jq -er "${filter} | .digests.sha256" "${metadata}")"
          curl -fsSL --retry 3 "${url}" -o "${archive}"
          printf '%s  %s\n' "${digest}" "${archive}" | sha256sum -c -
          binary="$(unzip -Z1 "${archive}" | grep -E '/bin/clang-format$' | head -n 1)"
          test -n "${binary}"
          unzip -p "${archive}" "${binary}" > "${bindir}/clang-format"
          chmod +x "${bindir}/clang-format"
          "${bindir}/clang-format" --version
          echo "${bindir}" >> "${GITHUB_PATH}"
      - name: Check changed-file formatting
        env:
          SIR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ -n "$SIR_BASE" ]]; then
            cmake -DSIR_FORMAT_BASE="$SIR_BASE" -P Build/CMake/CIFormat.cmake
          else
            cmake -P Build/CMake/CIFormat.cmake
          fi

  native:
    name: sir/native / ${{ matrix.os }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: dev
          - os: windows-2022
            preset: dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned GoogleTest for native C++17 tests
        run: git submodule update --init ThirdParty/GoogleTest
      - name: Set up MSVC compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: ./.github/actions/setup-build-tools
      - uses: actions/cache@v4
        with:
          path: .cache/fastbuild
          key: sir-fbuild-v1.20-${{ runner.os }}-dev-${{ github.sha }}
          restore-keys: |
            sir-fbuild-v1.20-${{ runner.os }}-dev-
      - name: Configure native engine
        run: cmake --preset "${{ matrix.preset }}" -DSIR_WITH_GOOGLETEST=ON
      - name: Compile engine and tests
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: Run selected native tests once
        shell: bash
        run: |
          label='^gate:pr$'
          if [[ "${{ github.event_name }}" != pull_request ]]; then label='^gate:develop$'; fi
          ctest --preset "${{ matrix.preset }}" --output-on-failure --no-tests=error -L "$label"
      - name: Verify no-op incremental rebuild
        run: cmake --build --preset dev

  required:
    name: sir/required
    runs-on: ubuntu-24.04
    if: always()
    needs: [source, native]
    steps:
      - name: Reject missing or skipped mandatory jobs
        env:
          SOURCE: ${{ needs.source.result }}
          NATIVE: ${{ needs.native.result }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          test "$SOURCE" = success
          test "$DRAFT" != true
          test "$NATIVE" = success
          echo "CI source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
