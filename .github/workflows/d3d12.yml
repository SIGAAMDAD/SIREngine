name: D3D12 headless bootstrap

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d3d12-warp:
    name: Windows D3D12 WARP build and transfer
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned D3D12 allocator
        run: git submodule update --init ThirdParty/D3D12MemoryAllocator
      - name: Set up MSVC compiler environment
        uses: ilammy/msvc-dev-cmd@v1
      - uses: ./.github/actions/setup-build-tools
      - name: Install pinned DXC for offline shader cooking
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.9.2609.5"
          $root = Join-Path $env:RUNNER_TEMP "sir-dxc"
          $archive = Join-Path $env:RUNNER_TEMP "sir-dxc.zip"
          $uri = "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.dxc/$version/microsoft.direct3d.dxc.$version.nupkg"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $root -Force
          $binary = Get-ChildItem -Path $root -Filter dxc.exe -Recurse |
            Where-Object { $_.FullName -match '[\\/](x64|amd64)[\\/]' } |
            Select-Object -First 1
          if (-not $binary) { throw "The pinned DXC NuGet archive does not contain an x64 dxc.exe" }
          Add-Content -Path $env:GITHUB_PATH -Value $binary.DirectoryName
          & $binary.FullName -help | Out-Null
      - name: Configure experimental D3D12
        run: cmake --preset dev -DSIR_WITH_D3D12=ON
      - name: Compile headless driver and tests
        run: cmake --build --preset dev --target SIRD3D12HeadlessTests SIRD3D12SharedApiTests SIRD3D12PipelineTests SIRD3D12CommandsTests SIRD3D12SurfaceTests SIRD3D12MemoryTests SIRD3D12DiagnosticsTests SIRD3D12Benchmarks
      - name: Run native WARP device and transfer checks
        run: ctest --preset dev --output-on-failure -R '^renderer[.]d3d12[.]'
      - name: Capture WARP D3D12 CPU and GPU timestamp metrics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Get-ChildItem -Path "out/Windows/dev" -Filter SIRD3D12Benchmarks.exe -Recurse |
            Select-Object -First 1
          if (-not $binary) { throw "D3D12 benchmark executable missing" }
          New-Item -ItemType Directory -Path "out/Nightly/Benchmarks" -Force | Out-Null
          & $binary.FullName --adapter warp --warmup 16 --iterations 96 --output "out/Nightly/Benchmarks/d3d12-warp.json"
          if ($LASTEXITCODE -ne 0) { throw "D3D12 benchmark returned $LASTEXITCODE" }
          $data = Get-Content "out/Nightly/Benchmarks/d3d12-warp.json" -Raw | ConvertFrom-Json
          if ($data.adapter.software -ne $true) { throw "WARP benchmark selected a non-software adapter" }
          if ($data.gpu_timestamp.frequency_hz -le 0 -or $data.cpu.submit_empty.p50_ns -lt 0) {
            throw "D3D12 performance metrics invalid"
          }
          Get-Content "out/Nightly/Benchmarks/d3d12-warp.json"
      - name: Preserve D3D12 performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sir-d3d12-warp-benchmarks
          path: out/Nightly/Benchmarks/d3d12-warp.json
          if-no-files-found: warn
          retention-days: 14
