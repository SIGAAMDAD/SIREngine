name: SIREngine nightly validation
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sir-nightly
  cancel-in-progress: false
jobs:
  source-audit:
    name: Full owned-source policy audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned clang-format 23.1.5
        run: python3 -m pip install --disable-pip-version-check clang-format==23.1.5
      - name: Validate tracked-source policy
        run: |
          cmake -P Build/CMake/CIHygiene.cmake
          cmake -P Build/CMake/CIStyle.cmake
          cmake -DSIR_FORMAT_FULL=ON -P Build/CMake/CIFormat.cmake
  native:
    name: Nightly native (${{ matrix.os }} / ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, preset: release}
          - {os: windows-2022, preset: release}
          - {os: ubuntu-24.04, preset: asan}
          - {os: ubuntu-24.04, preset: ubsan}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - run: git submodule update --init ThirdParty/GoogleTest
      - name: Full native build and single-pass CTest
        shell: bash
        env:
          SIR_CI_LABEL: ${{ matrix.os }}-${{ matrix.preset }}
        run: |
          extra=()
          if [[ "${{ matrix.preset }}" == asan ]]; then extra=(-DSIR_ENABLE_UBSAN=ON); fi
          bash Build/Scripts/NightlyBuild.sh "${{ matrix.preset }}" -DSIR_WITH_GOOGLETEST=ON "${extra[@]}"
      - name: Verify deterministic no-op rebuild
        if: matrix.preset == 'release'
        run: cmake --build --preset release
      - name: Repeat designated regressions on existing native build
        if: matrix.preset == 'asan' || matrix.os == 'windows-2022'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          ctest --preset "${{ matrix.preset }}" -L '^nightly:repeat$'
          --output-on-failure --no-tests=error --repeat until-fail:5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.preset }}
          path: out/Nightly/
          if-no-files-found: warn
          retention-days: 21
  performance:
    name: Nightly benchmark evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - run: git submodule update --init ThirdParty/GoogleTest ThirdParty/GoogleBenchmark
      - name: Optimized benchmark build and execution
        run: |
          cmake --preset profile -DSIR_BUILD_BENCHMARKS=ON -DSIR_WITH_GOOGLE_BENCHMARK=ON -DSIR_WITH_GOOGLETEST=ON
          cmake --build --preset profile
          bash Build/Scripts/RunGoogleBenchmarks.sh nightly-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-benchmarks
          path: out/Nightly/Benchmarks/
          if-no-files-found: error
          retention-days: 60
  source-dependencies:
    name: OpenAL Soft and meshoptimizer integration
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - run: git submodule update --init ThirdParty/OpenALSoft ThirdParty/meshoptimizer
      - name: Build native dependencies and run integration tests
        run: >
          bash Build/Scripts/NightlyBuild.sh tooling
          -DSIR_WITH_OPENAL_SOFT=ON -DSIR_WITH_MESHOPTIMIZER=ON
  clang-tooling:
    name: Clang compiler and source database
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - name: Build native tooling with Clang
        env:
          CC: clang
          CXX: clang++
        run: bash Build/Scripts/NightlyBuild.sh tooling
      - name: Verify compiler database
        run: test -s out/Linux/tooling/compile_commands.json
  summary:
    name: Nightly acceptance
    if: always()
    runs-on: ubuntu-24.04
    needs: [source-audit, native, performance, source-dependencies, clang-tooling]
    steps:
      - name: Reject missing gates
        env:
          POLICY: ${{ needs.source-audit.result }}
          NATIVE: ${{ needs.native.result }}
          PERF: ${{ needs.performance.result }}
          DEPENDENCIES: ${{ needs.source-dependencies.result }}
          CLANG: ${{ needs.clang-tooling.result }}
        run: test "$POLICY" = success && test "$NATIVE" = success && test "$PERF" = success && test "$DEPENDENCIES" = success && test "$CLANG" = success
