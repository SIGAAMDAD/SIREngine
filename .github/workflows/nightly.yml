name: SIREngine nightly native builds

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      macos_preview:
        description: 'Include experimental macOS build'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: sir-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-release:
    name: Native release and package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: profile
          - os: windows-2022
            preset: profile
          - os: ubuntu-24.04
            preset: release
          - os: windows-2022
            preset: release
          - os: ubuntu-24.04
            preset: asan
          - os: ubuntu-24.04
            preset: ubsan
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up MSVC compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: ./.github/actions/setup-build-tools
      - uses: actions/cache@v4
        with:
          path: .cache/fastbuild
          key: sir-fbuild-v1.20-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            sir-fbuild-v1.20-${{ runner.os }}-${{ matrix.preset }}-
      - name: Configure native engine
        run: cmake --preset "${{ matrix.preset }}"
      - name: Compile native engine
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: Run release tests
        run: ctest --preset "${{ matrix.preset }}"
      - name: Package release executable
        if: matrix.preset == 'release'
        run: cmake --build --preset release --target package
      - uses: actions/upload-artifact@v4
        if: matrix.preset == 'release'
        with:
          name: sirengine-${{ matrix.os }}-native
          path: out/**/SIREngine-*.zip
          if-no-files-found: error
          retention-days: 7

  macos-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.macos_preview
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - uses: actions/cache@v4
        with:
          path: .cache/fastbuild
          key: sir-fbuild-v1.20-macos-preview-${{ github.sha }}
          restore-keys: |
            sir-fbuild-v1.20-macos-preview-
      - run: cmake --preset macos-preview
      - run: cmake --build --preset macos-preview
      - run: ctest --preset macos-preview

  clang-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '4.4.5'
      - run: cmake --preset tooling
        env:
          CC: clang
          CXX: clang++
      - run: cmake --build --preset tooling --parallel 2
      - run: ctest --preset tooling
      - run: test -s out/Linux/tooling/compile_commands.json
