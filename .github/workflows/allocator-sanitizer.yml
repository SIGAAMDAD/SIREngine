name: Allocator sanitizer validation

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'Source/Core/Memory/**'
      - 'Tests/Unit/SIRAllocator*'
      - '.github/workflows/allocator-sanitizer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocator-sanitizer:
    name: Allocators / ASan + UBSan / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned GoogleTest
        run: git submodule update --init ThirdParty/GoogleTest
      - uses: ./.github/actions/setup-build-tools
      - name: Configure native allocator sanitizer build
        run: >
          cmake --preset dev
          -DSIR_WITH_GOOGLETEST=ON
          -DSIR_ENABLE_ASAN=ON
          -DSIR_ENABLE_UBSAN=ON
      - name: Compile sanitized engine and tests
        run: cmake --build --preset dev
      - name: Execute allocator suite with sanitizer checks
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset dev --output-on-failure -R '^core[.]memory[.]allocators'
