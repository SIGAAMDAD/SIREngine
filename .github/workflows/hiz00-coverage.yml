name: HIZ-00 LLVM 23 Coverage

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hiz00-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hiz00-llvm23:
    name: HIZ-00 Clang 23 AST and exact-source coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned GoogleTest
        run: git submodule update --init ThirdParty/GoogleTest
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.4.5'
      - name: Install matching Clang and LLVM 23 profiling tools
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL https://apt.llvm.org/llvm.sh -o "${RUNNER_TEMP}/llvm.sh"
          sudo bash "${RUNNER_TEMP}/llvm.sh" 23
          sudo apt-get install -y llvm-23 clang-23 libclang-rt-23-dev
          toolbin="${RUNNER_TEMP}/hiz-llvm23/bin"
          mkdir -p "${toolbin}"
          ln -s "$(command -v clang++-23)" "${toolbin}/clang++"
          ln -s "$(command -v llvm-cov-23)" "${toolbin}/llvm-cov"
          ln -s "$(command -v llvm-profdata-23)" "${toolbin}/llvm-profdata"
          "${toolbin}/clang++" --version | grep -E 'clang version 23[.]'
          "${toolbin}/llvm-cov" --version | grep -E 'LLVM version 23[.]'
          "${toolbin}/llvm-profdata" --version | grep -E 'LLVM version 23[.]'
          echo "${toolbin}" >> "${GITHUB_PATH}"
          echo "SIR_HIZ_LLVM_BIN=${toolbin}" >> "${GITHUB_ENV}"
      - name: Configure instrumented SIREngine CMake targets
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B out/HiZCoverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER="${SIR_HIZ_LLVM_BIN}/clang++" \
            -DCMAKE_C_COMPILER="$(command -v clang-23)" \
            -DCMAKE_CXX_FLAGS="-O0 -g -fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fprofile-instr-generate" \
            -DSIR_BUILD_TESTS=ON -DSIR_WITH_GOOGLETEST=ON \
            -DSIR_WITH_D3D12=OFF -DSIR_WITH_VULKAN=OFF
          test -s out/HiZCoverage/compile_commands.json
      - name: Build instrumented production and tests
        run: >
          cmake --build out/HiZCoverage --parallel 2
          --target SIRVisibilityFoundationTests SIRVisibilityFoundationGoogleTests
      - name: Clang 23 AST from authentic compilation database
        shell: bash
        run: |
          set -euo pipefail
          source_file="${GITHUB_WORKSPACE}/Source/Renderer/Visibility/SIRVisibilityFoundation.cpp"
          compiler_command="$(jq -er --arg src "${source_file}" \
            '.[] | select(.file == $src) | .command' out/HiZCoverage/compile_commands.json)"
          test -n "${compiler_command}"
          ( cd "${GITHUB_WORKSPACE}"; bash -c "${compiler_command} -Xclang -ast-dump -fsyntax-only" > out/HiZCoverage/hiz00.ast.txt )
          grep -q 'FunctionDecl.*sirHiZBuildReference' out/HiZCoverage/hiz00.ast.txt
          grep -q 'FunctionDecl.*sirVisibilityCullReference' out/HiZCoverage/hiz00.ast.txt
      - name: Execute every HIZ-00 test under LLVM instrumentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/HiZCoverage/profiles
          export LLVM_PROFILE_FILE="${GITHUB_WORKSPACE}/out/HiZCoverage/profiles/hiz-%p-%m.profraw"
          ctest --test-dir out/HiZCoverage -R '^renderer[.]visibility[.]' \
            --output-on-failure --no-tests=error \
            --output-junit "${GITHUB_WORKSPACE}/out/HiZCoverage/hiz-00-ctest.xml"
          find out/HiZCoverage/profiles -name '*.profraw' | grep -q .
      - name: Merge profiles and report four independent source counters
        shell: bash
        run: |
          set -euo pipefail
          src="${GITHUB_WORKSPACE}/Source/Renderer/Visibility/SIRVisibilityFoundation.cpp"
          build="out/HiZCoverage"
          "${SIR_HIZ_LLVM_BIN}/llvm-profdata" merge -sparse "${build}"/profiles/*.profraw -o "${build}/hiz-00.profdata"
          "${SIR_HIZ_LLVM_BIN}/llvm-cov" export \
            --instr-profile="${build}/hiz-00.profdata" \
            "${build}/Tests/Unit/SIRVisibilityFoundationTests" \
            --object="${build}/Tests/Unit/SIRVisibilityFoundationGoogleTests" \
            "${src}" > "${build}/hiz-00-llvm-export.json"
          jq -e --arg src "${src}" \
            '[.data[].files[] | select(.filename == $src)] | length == 1' \
            "${build}/hiz-00-llvm-export.json"
          jq -r --arg src "${src}" \
            '.data[].files[] | select(.filename == $src) | .summary |
             "lines: \(.lines.covered)/\(.lines.count) branches: \(.branches.covered)/\(.branches.count) functions: \(.functions.covered)/\(.functions.count) regions: \(.regions.covered)/\(.regions.count)"' \
            "${build}/hiz-00-llvm-export.json"
          jq --arg src "${src}" \
            '.data[].files[] | select(.filename == $src) | {filename,summary,segments,branches}' \
            "${build}/hiz-00-llvm-export.json" > "${build}/hiz-00-uncovered-debug.json"
          echo "Uncovered branch outcomes (line:column true-count false-count):"
          jq -r --arg src "${src}" \
            '.data[].files[] | select(.filename == $src) | .branches[] |
             select(.[4] == 0 or .[5] == 0) | "\(.[0]):\(.[1]) \(.[4]) \(.[5])"' \
            "${build}/hiz-00-llvm-export.json"
          echo "Zero-count source segments (line:column):"
          jq -r --arg src "${src}" \
            '.data[].files[] | select(.filename == $src) | .segments[] |
             select(.[2] == 0 and .[3] == true) | "\(.[0]):\(.[1])"' \
            "${build}/hiz-00-llvm-export.json" | sort -u | head -n 80
          jq -e --arg src "${src}" \
            '.data[].files[] | select(.filename == $src) | .summary |
             all([.lines,.branches,.functions,.regions][]; .count > 0 and .covered == .count)' \
            "${build}/hiz-00-llvm-export.json"
      - name: Upload exact-source coverage and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiz-00-llvm23-${{ github.sha }}
          path: |
            out/HiZCoverage/hiz-00-ctest.xml
            out/HiZCoverage/hiz-00.profdata
            out/HiZCoverage/hiz-00-llvm-export.json
            out/HiZCoverage/hiz-00-uncovered-debug.json
          if-no-files-found: warn
          retention-days: 14
