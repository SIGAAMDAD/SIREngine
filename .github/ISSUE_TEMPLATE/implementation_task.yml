name: Approved implementation work package
description: Implement one bounded package from a specific owner-approved milestone revision.
title: "[Work package] "
labels: ["marathon:tracked", "kind:implementation"]
body:
  - type: input
    id: parent
    attributes:
      label: Canonical parent issue
      placeholder: "#123"
    validations:
      required: true
  - type: input
    id: package_id
    attributes:
      label: Work-package ID
      placeholder: "GL46-01"
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Approved plan revision
      description: Must match the owner approval receipt and package allowlist
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Implementation contract
      description: Required behavior and interface boundaries, with concrete files
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: Required dependencies
      description: Exact issue IDs or SHA-qualified predecessor contracts
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Exclusive writable paths
      description: Source ownership that must not collide with another active worker
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      description: Compile, tests, coverage scope, negative cases, platforms and QA
    validations:
      required: true
