name: Setup SIREngine build tools
description: Install pinned CMake and FASTBuild without Python
inputs:
  cmake-version:
    description: Required CMake
    default: '4.4.5'
  fastbuild-version:
    description: Required FASTBuild
    default: '1.20'
runs:
  using: composite
  steps:
    - name: Install checksum-verified CMake 4.4.5
      shell: bash
      run: |
        set -euo pipefail
        test "${{ inputs.cmake-version }}" = 4.4.5
        root="${RUNNER_TEMP}/sir-cmake"
        mkdir -p "$root"
        case "$RUNNER_OS" in
          Linux) file=cmake-4.4.5-linux-x86_64.tar.gz; digest=ed85135c5a5135b45e50423cb406dea04ca3338da0b8ef3c9ede963559680be0 ;;
          Windows) file=cmake-4.4.5-windows-x86_64.zip; digest=326c826486d46a23cf9d5a1c9ee3a567d427bdd02c4a34071937a2a675cff004 ;;
          *) echo "Unsupported host $RUNNER_OS" >&2; exit 1 ;;
        esac
        curl -fsSL --retry 3 "https://cmake.org/files/v4.4/$file" -o "$root/$file"
        printf '%s  %s\n' "$digest" "$root/$file" | sha256sum -c -
        if [[ "$RUNNER_OS" == Linux ]]; then
          tar -xzf "$root/$file" -C "$root"
          echo "$root/cmake-4.4.5-linux-x86_64/bin" >> "$GITHUB_PATH"
        else
          unzip -q "$root/$file" -d "$root"
          echo "$root/cmake-4.4.5-windows-x86_64/bin" >> "$GITHUB_PATH"
        fi
    - name: Install FASTBuild
      shell: bash
      env:
        VERSION: ${{ inputs.fastbuild-version }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}" in
          Linux) package="FASTBuild-Linux-x64-v${VERSION}.zip" ;;
          Windows) package="FASTBuild-Windows-x64-v${VERSION}.zip" ;;
          macOS) package="FASTBuild-OSX-x64+ARM-v${VERSION}.zip" ;;
          *) exit 1 ;;
        esac
        root="${RUNNER_TEMP}/sir-fastbuild"
        mkdir -p "${root}/unpack" "${root}/bin"
        curl -fsSL --retry 3 "https://www.fastbuild.org/downloads/v${VERSION}/${package}" -o "${root}/archive.zip"
        echo "FASTBuild archive identity: ${package}"
        sha256sum "${root}/archive.zip"
        unzip -q "${root}/archive.zip" -d "${root}/unpack"
        binary="$(find "${root}/unpack" -type f \( -name FBuild.exe -o -name fbuild -o -name FBuild \) -print -quit)"
        test -n "${binary}"
        if [ "${RUNNER_OS}" = Windows ]; then
          cp "${binary}" "${root}/bin/FBuild.exe"
        else
          cp "${binary}" "${root}/bin/fbuild"
          chmod +x "${root}/bin/fbuild"
        fi
        echo "${root}/bin" >> "${GITHUB_PATH}"
    - name: Verify installed toolchain
      shell: bash
      run: |
        cmake --version | grep -F '4.4.5'
        if [ "${RUNNER_OS}" = Windows ]; then
          FBuild.exe -version | grep -F '1.20'
        else
          fbuild -version | grep -F '1.20'
        fi
